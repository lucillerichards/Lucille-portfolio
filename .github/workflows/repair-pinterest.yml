name: Locate case-study artwork assets
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('meet-me-in-the-sky.html').read_text()
          h=re.sub(r'src="data:[^"]+"','src="EMBEDDED"',h)
          for word in ['case__quad','Artwork by','AC Product','case__last']:
              p=h.lower().find(word.lower())
              print(word,'at',p,'CONTEXT',h[max(0,p-280):p+950] if p>=0 else '')
          PY
