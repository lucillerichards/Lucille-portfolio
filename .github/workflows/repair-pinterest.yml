name: Restore broken case-study images
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original embedded images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          p=Path('meet-me-in-the-sky.html')
          current=p.read_text()
          original=subprocess.check_output(['git','show','1b7a5ac054bc3a336ce71d7ef9b825737ab40702:meet-me-in-the-sky.html'],text=True)
          pat=r'<img\b[^>]*>'
          def images(html):
              return re.findall(pat,html,re.I|re.S)
          cur=images(current)
          old=images(original)
          print('Current image count:',len(cur),'original image count:',len(old))
          assert len(cur)==len(old), 'Image count changed; refusing ambiguous replacement'
          replacements=0
          for index,(a,b) in enumerate(zip(cur,old)):
              if 'case-replacement.jpg' in a:
                  assert b.startswith('<img') and 'src="data:' in b, 'Original image not embedded'
                  current=current.replace(a,b,1)
                  replacements+=1
                  print('Restored image index',index)
          assert replacements==2, f'Expected 2 replacements, found {replacements}'
          p.write_text(current)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-me-in-the-sky.html
          git commit -m "Restore original embedded images to fix broken assets"
          git push
