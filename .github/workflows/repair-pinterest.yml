name: Inspect official Northern Lights Spotify embeds
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import requests,re,html
          for url in ['https://www.dunorthernlights.co.uk/music','https://dur.ac.uk/news-events/latest-news/2026/03/durhams-got-talent-/']:
              try:
                  r=requests.get(url,timeout=20)
                  print('SOURCE',url,'STATUS',r.status_code,'LENGTH',len(r.content))
                  links=set(re.findall(r'https?[^"\s<>]{0,200}spotify[^"\s<>]{0,180}',html.unescape(r.text),re.I))
                  links|=set(re.findall(r'https?[^"\s<>]{0,200}open\.spotify\.com/[^"\s<>]{0,180}',html.unescape(r.text),re.I))
                  for link in list(links)[:30]: print('SPOTIFY',link[:260])
              except Exception as e: print(type(e).__name__,str(e)[:150])
          PY
