name: Correct album case-study text
on:
  push:
    paths:
      - '.github/workflows/repair-pinterest.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct the album description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('meet-me-in-the-sky.html')
          text=p.read_text()
          old='planning, personal changes and creative passion'
          new='planning, personnel changes and creative passion'
          if old not in text and new not in text:
              raise RuntimeError('Expected album description was not found')
          p.write_text(text.replace(old,new))
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-me-in-the-sky.html
          git diff --cached --quiet || (git commit -m "Correct personnel changes in album description" && git push)
