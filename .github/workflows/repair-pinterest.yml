name: Inspect case study image layout
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect image structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('meet-me-in-the-sky.html').read_text()
          for i,m in enumerate(re.finditer(r'<img\\b[^>]*>',h,re.I)):
              tag=m.group()
              print('IMAGE',i,'TAG',re.sub(r'(?i)src="data:[^"]+"','src="(embedded)"',tag)[:320])
              print('CONTEXT',re.sub(r'(?i)data:image/[^"\\s]+','(embedded)',h[max(0,m.start()-210):m.start()])[-210:])
          for m in re.finditer(r'<style[^>]*>(.*?)</style>',h,re.I|re.S):
              txt=m.group(1)
              print('STYLE TAIL',txt[-11000:])
          clean=re.sub(r'data:image/[^"\\s]+','(embedded image)',h)
          for name in ['case__intro','case__process','case__last']:
              pos=clean.find('<section class="'+name+'">')
              print('SECTION',name,clean[pos:pos+2700])
          print('case sections',re.findall(r'<section[^>]*class="[^"]*case[^"]*"[^>]*>',h)[:40])
          PY
