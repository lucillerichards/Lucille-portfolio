name: Update Pinterest board height and page typo
on:
  push:
    paths:
      - '.github/workflows/repair-pinterest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-case-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make minimal case study edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('meet-me-in-the-sky.html')
          html=p.read_text(encoding='utf-8')
          # Make the working Pinterest board about 140px shorter.
          anchor=re.search(r'<a\b[^>]*data-pin-do="embedBoard"[^>]*>',html,re.I)
          if not anchor:
              raise RuntimeError('Pinterest board widget not found')
          new=anchor.group().replace('data-pin-scale-height="440"','data-pin-scale-height="300"')
          if new==anchor.group() and 'data-pin-scale-height="300"' not in new:
              raise RuntimeError('Unexpected Pinterest embed height: '+anchor.group())
          html=html[:anchor.start()]+new+html[anchor.end():]
          html=html.replace('min-height:460px','min-height:320px')
          # Fix copy without changing any other content.
          html,count=re.subn(r'\bpersonnel\b','personal',html,flags=re.I)
          print('Personnel typo occurrences corrected:',count)
          if not count:
              raise RuntimeError('Expected typo not found; do not commit unverified edit')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-me-in-the-sky.html
          if ! git diff --cached --quiet; then
            git commit -m "Shorten Pinterest moodboard and fix personal typo"
            git push
          fi
