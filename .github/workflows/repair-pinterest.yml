name: Enlarge Pinterest pins
on:
  push:
    paths:
      - '.github/workflows/repair-pinterest.yml'
permissions:
  contents: write
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Pinterest pin dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('meet-me-in-the-sky.html')
          text=p.read_text()
          old='data-pin-scale-width="110"'
          new='data-pin-scale-width="170"'
          assert old in text or new in text
          p.write_text(text.replace(old,new))
          PY
      - name: Save change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-me-in-the-sky.html
          git diff --cached --quiet || (git commit -m "Increase Pinterest pin size" && git push)
