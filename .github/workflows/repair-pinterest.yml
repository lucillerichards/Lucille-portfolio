name: Correct artwork credits
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
permissions:
  contents: write
jobs:
  credits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update final artwork credits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('meet-me-in-the-sky.html')
          h=p.read_text(encoding='utf-8')
          old='Artwork by AC Product &amp; Northern Lights)'
          new='Artwork by AC Product &amp; Northern Lights'
          assert old in h, 'Original artwork credit not found'
          h=h.replace(old,new,1)
          assert '<figure class="case__last-right">' in h, 'Final image figure not found'
          import re
          pattern=r'(<figure class="case__last-right">\s*<img\b[^>]*>)(\s*</figure>)'
          replacement=r'\1<figcaption>Artwork by Lucille Richards</figcaption>\2'
          h,n=re.subn(pattern,replacement,h,count=1)
          assert n==1, 'Final image markup did not match'
          p.write_text(h,encoding='utf-8')
          print('Updated both artwork credits')
          PY
      - name: Commit edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-me-in-the-sky.html
          git diff --cached --quiet || (git commit -m "Correct and add final artwork credits" && git push)
