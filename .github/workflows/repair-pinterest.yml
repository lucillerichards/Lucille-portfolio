name: Standardise opening paragraph alignment
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore consistent intro text wrapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('meet-me-in-the-sky.html')
          h=p.read_text(encoding='utf-8')
          css="""
          /* Consistent opening copy: normal wrapping and paragraph alignment */
          .case__intro .case__copy { text-align:center; }
          .case__intro .case__copy p,
          .case__intro .case__copy p:first-child {
            text-align:inherit;
            text-wrap:wrap;
            white-space:normal;
            max-width:none;
            margin-left:0;
            margin-right:0;
          }
          """
          if 'Consistent opening copy: normal wrapping' not in h:
              h=h.replace('</style>',css+'</style>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-me-in-the-sky.html
          git diff --cached --quiet || (git commit -m "Restore consistent introductory paragraph wrapping" && git push)
