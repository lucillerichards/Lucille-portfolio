name: Align final images in case study
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align paired images at the same baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('meet-me-in-the-sky.html')
          html=p.read_text()
          css="""
          /* Final paired artwork: line up image top edges below each text block. */
          .case__last { align-items:stretch; }
          .case__last > div, .case__last > figure {
            display:flex; flex-direction:column; min-width:0;
          }
          .case__last > div > figure, .case__last > figure > img {
            margin-top:auto;
          }
          .case__last > div > figure { position:relative; margin-bottom:42px; }
          .case__last > div > figure figcaption {
            position:absolute; top:100%; left:0; right:0; margin-top:12px;
          }
          .case__last > div > figure img, .case__last > figure > img {
            display:block; width:100%; height:auto; aspect-ratio:1 / 1;
            object-fit:contain; object-position:center;
          }
          @media(max-width:760px) {
            .case__last > div > figure {margin-bottom:38px;}
          }
          """
          if 'Final paired artwork: line up image top edges' not in html:
              html=html.replace('</style>',css+'</style>',1)
          assert 'Final paired artwork: line up image top edges' in html
          p.write_text(html)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-me-in-the-sky.html
          git diff --cached --quiet || (git commit -m "Align bottom case study images" && git push)
