name: Inspect case study image layout
on:
  push:
    paths: ['.github/workflows/repair-pinterest.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect image structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          h=Path('meet-me-in-the-sky.html').read_text()
          s=BeautifulSoup(h,'html.parser')
          for i,img in enumerate(s.find_all('img')):
              par=img.parent
              print('IMAGE',i,'ALT',img.get('alt','')[:90],'CLASS',img.get('class'),'PARENT',par.name,par.get('class'), 'GRAND',par.parent.get('class') if par.parent else '')
          for style in s.find_all('style'):
              txt=style.get_text()
              print('STYLE RELEVANT',txt[-11000:])
          print('BODY children',[(x.name,x.get('class')) for x in s.body.find_all(recursive=False) if x.name])
          PY
